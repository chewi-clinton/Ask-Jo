<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask Jo - Portal Gateway</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-page-body">
    <div class="auth-split-container">
      <div class="auth-splash-panel"></div>
      <div class="auth-form-panel">
        <div class="auth-form-wrapper">
          <div class="auth-brand-header">Ask Jo</div>

          <div class="auth-tabs">
            <button
              type="button"
              id="tab-login"
              class="auth-tab active"
              onclick="switchAuthMode('login')"
            >
              Login
            </button>
            <button
              type="button"
              id="tab-register"
              class="auth-tab"
              onclick="switchAuthMode('register')"
            >
              Register
            </button>
          </div>

          <h2 id="auth-title" class="auth-main-title">Welcome back</h2>
          <p id="auth-subtitle" class="auth-sub-title">
            Enter your details to access your mentorship dashboard.
          </p>

          <div id="auth-error-msg" class="auth-alert hidden"></div>

          <form id="auth-core-form" onsubmit="handleAuthSubmit(event)">
            <div id="group-username" class="form-group hidden">
              <label for="auth-username">Username</label>
              <input
                type="text"
                id="auth-username"
                placeholder="yourusername"
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label for="auth-email">Email</label>
              <input
                type="email"
                id="auth-email"
                placeholder="name@example.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="auth-password">Password</label>
                <a href="#" class="form-link-sm">Forgot Password?</a>
              </div>
              <input
                type="password"
                id="auth-password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <div id="group-confirm-password" class="form-group hidden">
              <label for="auth-confirm-password">Confirm Password</label>
              <input
                type="password"
                id="auth-confirm-password"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>

            <button
              type="submit"
              id="auth-submit-btn"
              class="btn-primary full-width font-medium"
            >
              Log in to Ask Jo
            </button>

            <div class="auth-divider">
              <span>OR</span>
            </div>

            <button
              type="button"
              class="btn-outline full-width font-medium"
              onclick="window.location.href = 'chat.html'"
            >
              Continue as Guest
            </button>
          </form>

          <div class="auth-footer-links">
            <span>&copy; 2026 Ask Jo.</span>
            <div class="footer-right-links">
              <a href="#">Privacy Policy</a>
              <a href="#">Help Center</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("mode") === "register") {
          switchAuthMode("register");
        }
      });
    </script>
  </body>
</html>
