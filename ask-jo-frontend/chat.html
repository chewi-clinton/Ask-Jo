<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask Jo - Chat Workspace</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="chat-workspace-body">
    <nav class="navbar">
      <div
        class="nav-logo"
        style="cursor: pointer"
        onclick="window.location.href = 'index.html'"
      >
        Ask Jo
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="chat.html" class="active">Conversations</a>
      </div>
      <div class="nav-actions" id="header-user-actions"></div>
    </nav>

    <div class="workspace-viewport">
      <aside class="chat-sidebar" id="sidebar-panel">
        <button
          type="button"
          class="btn-primary full-width"
          id="new-chat-btn"
          onclick="createNewChatSession()"
        >
          + New Conversation
        </button>
        <div class="sidebar-list-container" id="conversations-list"></div>
      </aside>

      <main class="chat-main-window">
        <div class="chat-messages-container" id="chat-output-feed"></div>

        <div class="chat-input-sticky-dock">
          <form
            id="chat-submittal-form"
            onsubmit="transmitUserPrompt(event)"
            class="chat-form-raw"
          >
            <input
              type="text"
              id="chat-input-box"
              placeholder="Ask Jo about jobs, youth programs, or counseling..."
              required
              autocomplete="off"
            />
            <button type="submit" class="chat-send-btn">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
          <div class="chat-disclaimer">
            Jo is an AI companion providing resource lookups. Verify
            administrative requirements independently.
          </div>
        </div>
      </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
